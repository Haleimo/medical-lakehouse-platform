# Medical Lakehouse Platform - GitLab CI/CD Pipeline
# Build, test, scan, package, and deploy using GitOps.

stages:
  - lint
  - test
  - build
  - scan
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  AIRFLOW_IMAGE_NAME: "$CI_REGISTRY_IMAGE/airflow"
  GARAGE_CHART_NAME: "garage"

default:
  interruptible: true

# -----------------------------------------------------------------------------
# Shared Docker-in-Docker configuration
# -----------------------------------------------------------------------------
.docker-in-docker:
  image: docker:25.0.3
  services:
    - name: docker:25.0.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login
      --username "$CI_REGISTRY_USER"
      --password-stdin "$CI_REGISTRY"

# -----------------------------------------------------------------------------
# STAGE 1: LINT
# -----------------------------------------------------------------------------

lint:python:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check .
    - ruff format --check .

lint:dockerfile:
  stage: lint
  image:
    name: hadolint/hadolint:latest-alpine
    entrypoint: [""]
  script:
    - hadolint --failure-threshold warning docker/Dockerfile.airflow

lint:helm:
  stage: lint
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - helm lint charts/garage

lint:yaml:
  stage: lint
  image:
    name: cytopia/yamllint:latest
    entrypoint: [""]
  script:
    - 'yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable}}" argocd/ k8s/ charts/ .gitlab-ci.yml'

# -----------------------------------------------------------------------------
# STAGE 2: TEST
# -----------------------------------------------------------------------------

test:pytest:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends default-jre-headless gcc build-essential
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir --upgrade pip setuptools wheel
    - pip install --no-cache-dir -r requirements-dev.txt
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest tests/ -v --cov=src --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days

# -----------------------------------------------------------------------------
# STAGE 3: BUILD
# -----------------------------------------------------------------------------

build:airflow-image:
  extends: .docker-in-docker
  stage: build
  script:
    - 'export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"'
    - 'echo "Building Airflow image: ${AIRFLOW_IMAGE_NAME}:${TAG}"'
    - |
      docker build 
        --file docker/Dockerfile.airflow 
        --tag "${AIRFLOW_IMAGE_NAME}:${TAG}" 
        --tag "${AIRFLOW_IMAGE_NAME}:latest" 
        .
    - docker push "${AIRFLOW_IMAGE_NAME}:${TAG}"
    - docker push "${AIRFLOW_IMAGE_NAME}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# STAGE 4: CONTAINER SECURITY SCAN
# -----------------------------------------------------------------------------

scan:container-security:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - 'export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"'
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "${AIRFLOW_IMAGE_NAME}:${TAG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# STAGE 5: PACKAGE HELM CHART
# -----------------------------------------------------------------------------

package:helm-garage:
  stage: package
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl
  script:
    - helm package charts/garage --destination .
    - 'export CHART_TGZ="$(ls garage-*.tgz)"'
    - |
      curl --fail-with-body --show-error --silent 
        --request POST 
        --form "chart=@${CHART_TGZ}" 
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" 
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
  artifacts:
    paths:
      - garage-*.tgz
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# STAGE 6: DEPLOY - ARGO CD GITOPS SYNC
# -----------------------------------------------------------------------------

deploy:argocd-sync:
  stage: deploy
  image:
    name: curlimages/curl:latest
    entrypoint: [""]
  script:
    - |
      if [ -n "$ARGOCD_SERVER" ] && [ -n "$ARGOCD_AUTH_TOKEN" ]; then
        echo "Requesting Argo CD synchronization..."

        curl --fail-with-body --show-error --silent \
          --request POST \
          "${ARGOCD_SERVER%/}/api/v1/applications/medical-lakehouse-root/sync" \
          --header "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
          --header "Content-Type: application/json"
      else
        echo "Argo CD credentials are not configured."
        echo "Skipping the sync request; automated Argo CD polling must be configured separately."
      fi
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success