apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-orchestration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: medical-lakehouse
    app.kubernetes.io/component: orchestration
spec:
  project: default
  source:
    repoURL: 'https://airflow.apache.org'
    chart: airflow
    targetRevision: 1.15.0
    helm:
      values: |
        executor: "LocalExecutor"
        images:
          airflow:
            repository: registry.gitlab.com/abdelhaleemmmohammed/medical-lakehouse-platform/airflow
            tag: latest
            pullPolicy: Always
        dags:
          gitSync:
            enabled: true
            repo: 'https://github.com/Haleimo/medical-lakehouse-platform.git'
            branch: main
            subPath: "dags"
            wait: 60
            depth: 1
        env:
          - name: RUN_MODE
            value: "cluster"
          - name: LOG_LEVEL
            value: "INFO"
          - name: MAX_INVALID_RATIO
            value: "0.2"
        extraEnvFrom: |
          - secretRef:
              name: medical-pipeline-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: data-lake
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
