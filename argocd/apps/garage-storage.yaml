apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: medical-lakehouse
    app.kubernetes.io/component: storage
spec:
  project: default
  source:
    repoURL: 'https://github.com/<your-org>/medical-lakehouse-platform.git'
    targetRevision: HEAD
    path: charts/garage
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: data-lake
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
