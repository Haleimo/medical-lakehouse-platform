apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: medical-lakehouse
    app.kubernetes.io/component: platform-config
spec:
  project: default
  source:
    repoURL: 'https://github.com/Haleimo/medical-lakehouse-platform.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: data-lake
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
