apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino-query
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: medical-lakehouse
    app.kubernetes.io/component: query-engine
spec:
  project: default
  source:
    repoURL: 'https://trinodb.github.io/charts'
    chart: trino
    targetRevision: 0.36.0
    helm:
      values: |
        server:
          workers: 2
        catalogs:
          iceberg: |
            connector.name=iceberg
            iceberg.catalog.type=nessie
            iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
            iceberg.nessie-catalog.default-warehouse-dir=s3://nessie-warehouse/
            fs.native-s3.enabled=true
            s3.endpoint=http://garage.data-lake.svc.cluster.local:3900
            s3.path-style-access=true
            s3.aws-access-key=${ENV:S3_ACCESS_KEY}
            s3.aws-secret-key=${ENV:S3_SECRET_KEY}
        additionalConfigProperties: []
        extraEnv:
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: trino-s3-credentials
                key: access-key
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: trino-s3-credentials
                key: secret-key
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: data-lake
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
