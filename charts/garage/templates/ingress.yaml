{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-ingress
  namespace: {{ .Values.global.namespace | default "data-lake" }}
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: {{ .Values.ingress.className | default "kong" }}
  rules:
    - host: {{ .Values.ingress.webuiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-webui
                port:
                  number: 3000
    - host: {{ .Values.ingress.s3Host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3900
{{- end }}
