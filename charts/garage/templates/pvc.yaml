apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: {{ .Values.global.namespace | default "data-lake" }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.garage.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.garage.storage.size }}
