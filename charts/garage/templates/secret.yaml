{{- if not .Values.garage.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: {{ .Values.global.namespace | default "data-lake" }}
type: Opaque
stringData:
  rpc-secret: {{ .Values.garage.rpcSecret | required "garage.rpcSecret (or garage.existingSecret) must be set -- see values.yaml comments. Do not commit real values." | quote }}
  admin-token: {{ .Values.garage.adminToken | required "garage.adminToken (or garage.existingSecret) must be set -- see values.yaml comments. Do not commit real values." | quote }}
{{- end }}
