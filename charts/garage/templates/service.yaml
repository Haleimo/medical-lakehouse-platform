apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: {{ .Values.global.namespace | default "data-lake" }}
  labels:
    app.kubernetes.io/name: garage
spec:
  type: ClusterIP
  ports:
    - name: s3-api
      port: 3900
      targetPort: s3-api
    - name: rpc
      port: 3901
      targetPort: rpc
    - name: admin
      port: 3903
      targetPort: admin
    - name: web
      port: 3902
      targetPort: web
  selector:
    app.kubernetes.io/name: garage
---
{{- if .Values.webui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: {{ .Values.global.namespace | default "data-lake" }}
  labels:
    app.kubernetes.io/name: garage-webui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.webui.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: garage-webui
{{- end }}
