# Garage (S3-compatible object storage) configuration for local development.
# Secrets (rpc_secret, admin token) are injected via environment variables
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN in .env) in docker-compose.yml /
# a Kubernetes Secret in k8s -- never hardcoded here.
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1  # Single-node dev/demo. See README "High Availability" for what a
                        # multi-node, replication_factor=3 deployment would require.

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret is read from the GARAGE_RPC_SECRET environment variable by the
# Garage process itself (Garage supports GARAGE_RPC_SECRET as an env override);
# it is intentionally left unset here.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
# admin_token is read from the GARAGE_ADMIN_TOKEN environment variable.
