# Spark configuration for CLUSTER mode (RUN_MODE=cluster). Not needed for
# local[*] dev mode -- see spark/jobs/bronze_to_silver.py build_spark_session().
#
# The Iceberg + Nessie runtime jars are fetched from Maven Central at
# spark-submit time via spark.jars.packages, rather than bundled in this
# repository or a Docker image layer, so version bumps are a one-line change.
spark.jars.packages   org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.99.0
spark.sql.extensions  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# Remaining catalog-specific settings (catalog name, Nessie URI, warehouse
# path, S3 credentials) are set programmatically in build_spark_session()
# from environment variables / Kubernetes Secrets, not in this file.
