# Trino Iceberg connector configuration, pointed at the Project Nessie catalog.
# All values are read from environment variables at container start via
# Trino's `${ENV:VARNAME}` substitution -- nothing here is hardcoded.
# Reference: https://trino.io/docs/current/connector/iceberg.html#nessie-catalog

connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=${ENV:NESSIE_URI}
iceberg.nessie-catalog.default-warehouse-dir=${ENV:WAREHOUSE_PATH}
iceberg.nessie-catalog.ref=${ENV:NESSIE_DEFAULT_BRANCH}

fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
