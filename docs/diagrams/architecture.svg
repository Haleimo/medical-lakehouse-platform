<text x="896" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">local filesystem in RUN_MODE=local</text>
<text x="896" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">&#8226; Bronze bucket</text>
<text x="896" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">  (raw resource + metadata)</text>
