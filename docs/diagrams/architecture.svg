<text x="106" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">MedicationRequest)</text>
<text x="106" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">DICOM imaging metadata</text>
<text x="106" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">(JSON, metadata only)</text>
