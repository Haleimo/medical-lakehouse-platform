<text x="501" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">src/ingestion/dicom_ingest.py</text>
<text x="501" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">src/fhir/validator.py</text>
<text x="501" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">&#8226; structural + required-field</text>
<text x="501" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">  validation per resource</text>
<text x="501" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a">&#8226; stamp batch_id + timestamp</text>
