<text x="552.0" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">BRONZE (raw)</text>
<text x="426" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">run_ingestion()</text>
<text x="426" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">src/ingestion/fhir_ingest.py</text>
<text x="426" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; validate_resource() per</text>
<text x="426" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  resource (structural +</text>
<text x="426" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  required fields + status</text>
<text x="426" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  enums + date sanity)</text>
<text x="426" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; stamp batch_id + timestamp</text>
<rect x="734" y="130" width="280" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="734" y="130" width="280" height="30" rx="10" fill="#7c3aed"/>
<rect x="734" y="144" width="280" height="16" fill="#7c3aed"/>
<text x="874.0" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">TRANSFORM (Spark)</text>
<text x="748" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">spark/jobs/bronze_to_silver.py</text>
<text x="748" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">1. parse_resource() &#8594; flat row</text>
<text x="748" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">2. deidentify_row() &#8212; hash/</text>
<text x="748" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">   null/generalize PHI fields</text>
<text x="748" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">3. deduplicate(id_field='id')</text>
<text x="748" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">4. referential-integrity check</text>
<rect x="1056" y="130" width="280" height="190" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<rect x="1056" y="130" width="280" height="30" rx="10" fill="#475569"/>
<rect x="1056" y="144" width="280" height="16" fill="#475569"/>
<text x="1196.0" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">SILVER (de-identified)</text>
<text x="1070" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">Apache Iceberg via Nessie</text>
<text x="1070" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">patient &#183; observation &#183;</text>
<text x="1070" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">encounter &#183; condition &#183;</text>
<text x="1070" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">medication_request</text>
<text x="1070" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">assert_no_phi_leak() gate</text>
<text x="1070" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">before any write is committed</text>
<rect x="1378" y="130" width="280" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="1378" y="130" width="280" height="30" rx="10" fill="#7c3aed"/>
<rect x="1378" y="144" width="280" height="16" fill="#7c3aed"/>
<text x="1518.0" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">AGGREGATE (Spark)</text>
<text x="1392" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">spark/jobs/silver_to_gold.py</text>
<text x="1392" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">src/transformations/gold.py</text>
<text x="1392" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; patient_summary</text>
<text x="1392" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; observation_daily_summary</text>
<text x="1392" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; encounter/condition/</text>
<text x="1392" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  medication_summary</text>
