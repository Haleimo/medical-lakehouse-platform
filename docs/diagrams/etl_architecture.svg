<text x="230.0" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">SOURCES</text>
<text x="104" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">FHIR JSON / Bundles</text>
<text x="104" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  Patient, Encounter,</text>
<text x="104" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  Observation, Condition,</text>
<text x="104" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  MedicationRequest</text>
<text x="104" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">DICOM imaging metadata</text>
<text x="104" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  (metadata only, no pixels)</text>
<rect x="412" y="130" width="280" height="190" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<rect x="412" y="130" width="280" height="30" rx="10" fill="#b45309"/>
