<text x="552.0" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">QUARANTINE</text>
<text x="406" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">invalid resources routed here,</text>
<text x="406" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">never reach Bronze &#8212;</text>
<text x="406" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">reason recorded (ValidationError)</text>
<line x1="874.0" y1="320" x2="874.0" y2="361" stroke="#dc2626" stroke-width="2.25" stroke-dasharray="6,5" marker-end="url(#arrowhead-red)"/>
<rect x="714" y="375" width="320" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="714" y="375" width="320" height="30" rx="10" fill="#dc2626"/>
<rect x="714" y="389" width="320" height="16" fill="#dc2626"/>
<text x="874.0" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">QUALITY GATE</text>
<text x="728" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">enforce_quality_gate()</text>
<text x="728" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">invalid_ratio &gt; MAX_INVALID_RATIO</text>
<text x="728" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8594; raises DataQualityError, halts DAG</text>
<line x1="1196.0" y1="320" x2="1196.0" y2="361" stroke="#dc2626" stroke-width="2.25" stroke-dasharray="6,5" marker-end="url(#arrowhead-red)"/>
