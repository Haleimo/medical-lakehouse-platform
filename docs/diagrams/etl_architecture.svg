<rect x="1036" y="375" width="320" height="30" rx="10" fill="#dc2626"/>
<rect x="1036" y="389" width="320" height="16" fill="#dc2626"/>
<text x="1196.0" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">REFERENTIAL CHECK</text>
<text x="1050" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">quarantine_referential_failures()</text>
<text x="1050" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">patient_id, encounter_id, dicom-&gt;mrn_hash:</text>
<text x="1050" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">persisted to quarantine, not just dropped</text>
<rect x="90" y="500" width="280" height="170" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<rect x="90" y="500" width="280" height="30" rx="10" fill="#a16207"/>
<rect x="90" y="514" width="280" height="16" fill="#a16207"/>
<text x="230.0" y="520" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">GOLD (BI-ready)</text>
<text x="104" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">Apache Iceberg via Nessie</text>
<text x="104" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">iceberg.medical_gold.*</text>
<text x="104" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">one row per patient / day+code /</text>
<text x="104" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">encounter class / condition /</text>
<text x="104" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">medication code</text>
<text x="104" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">BI-ready grain, no raw PHI</text>
<rect x="412" y="500" width="280" height="170" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<rect x="412" y="500" width="280" height="30" rx="10" fill="#0d9488"/>
<rect x="412" y="514" width="280" height="16" fill="#0d9488"/>
<text x="552.0" y="520" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">SERVING</text>
<text x="426" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">Trino distributed SQL engine</text>
<text x="426" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">queries Iceberg/Nessie directly</text>
<text x="426" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">sql/analytics/*.sql</text>
<text x="426" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; patient counts</text>
<text x="426" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; observation trends</text>
<text x="426" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; healthcare KPIs</text>
<rect x="734" y="500" width="280" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<rect x="734" y="500" width="280" height="30" rx="10" fill="#16a34a"/>
<rect x="734" y="514" width="280" height="16" fill="#16a34a"/>
<text x="874.0" y="520" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">CONSUMERS</text>
<text x="748" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">BI dashboards / notebooks /</text>
<text x="748" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">ad-hoc SQL over Trino</text>
<text x="748" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">(no BI tool bundled &#8212;</text>
<text x="748" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">see README limitations)</text>
<rect x="1056" y="500" width="280" height="170" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
<rect x="1056" y="500" width="280" height="30" rx="10" fill="#4338ca"/>
<rect x="1056" y="514" width="280" height="16" fill="#4338ca"/>
<text x="1196.0" y="520" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">RUN MODES</text>
<text x="1070" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">RUN_MODE=local (default)</text>
<text x="1070" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; Parquet on local disk,</text>
<text x="1070" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  data/{bronze,silver,gold}/</text>
<text x="1070" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">RUN_MODE=cluster</text>
<text x="1070" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">&#8226; real Iceberg tables via</text>
<text x="1070" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">  Nessie + S3-compatible Garage</text>
