<text x="60" y="96" font-size="13" font-weight="700" fill="#334155">SILVER (source)</text>
<text x="760" y="96" font-size="13" font-weight="700" fill="#334155">GOLD (aggregated, BI-ready)  &#8212;  written by spark/jobs/silver_to_gold.py</text>
<rect x="60" y="810" width="340" height="144" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="74" y="834" font-size="13.5" font-weight="700" fill="#92400e">Design notes</text>
<text x="74" y="856" font-size="11.5" fill="#451a03">Gold tables are aggregates, not copies of Silver.</text>
<text x="74" y="873" font-size="11.5" fill="#451a03">There are no foreign keys between Gold tables:</text>
<text x="74" y="890" font-size="11.5" fill="#451a03">each is a self-contained mart at the grain a</text>
<text x="74" y="907" font-size="11.5" fill="#451a03">dashboard queries (no joins needed at read time).</text>
<text x="74" y="924" font-size="11.5" fill="#451a03">patient_id in patient_summary is the only</text>
<text x="74" y="941" font-size="11.5" fill="#451a03">row-level identifier and is already pseudonymous.</text>
<text x="1460" y="1156" text-anchor="end" font-size="11" fill="#94a3b8">medical-lakehouse-platform &#183; gold_model.svg</text>
