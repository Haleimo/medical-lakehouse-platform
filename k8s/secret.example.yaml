apiVersion: v1
kind: Secret
metadata:
  name: medical-pipeline-secrets
  namespace: data-lake
type: Opaque
stringData:
  DEID_SALT: "CHANGE-ME-use-a-long-random-value"
  S3_ACCESS_KEY: "CHANGE-ME"
  S3_SECRET_KEY: "CHANGE-ME"
